<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JordanGold.co</title>
    <!--
      Static hosts serve this file for any path that has no matching file
      (like /about). Save the requested URL and send the visitor to the app,
      which restores the URL before React Router starts (see index.html).
    -->
    <script>
      try {
        sessionStorage.setItem("redirect", location.href);
      } catch (e) {}
      location.replace("/");
    </script>
    <meta http-equiv="refresh" content="0; url=/" />
  </head>
  <body></body>
</html>
